name: build

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 20 * * *" # 每日 04:00 北京时间（before watchtower 05:00 扫描）
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/jazzzzmaybe/frigate-image:stable-rocm
  BASE_IMAGE: ${{ vars.BASE_IMAGE || 'docker.cnb.cool/frigate-cn/frigate:stable-rocm' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 腾出磁盘空间（base 镜像较大）
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: 检查上游 digest 是否变化（仅定时任务可跳过）
        id: gate
        run: |
          set -euo pipefail
          BASE_DIGEST="$(docker buildx imagetools inspect "$BASE_IMAGE" --format '{{.Manifest.Digest}}')"
          echo "base_digest=$BASE_DIGEST" >> "$GITHUB_OUTPUT"
          CUR="$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Image}}' 2>/dev/null | jq -r '.config.Labels["org.opencontainers.image.base.digest"] // empty' || true)"
          echo "上游 digest: $BASE_DIGEST"
          echo "上次构建记录: ${CUR:-无}"
          if [ "${{ github.event_name }}" = "schedule" ] && [ -n "$CUR" ] && [ "$CUR" = "$BASE_DIGEST" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "上游未变化 → 跳过构建/推送（避免无谓重启）"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 登录 GHCR
        if: steps.gate.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送派生镜像
        if: steps.gate.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}
          labels: |
            org.opencontainers.image.base.digest=${{ steps.gate.outputs.base_digest }}
